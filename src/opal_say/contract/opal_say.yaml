  /api/v1/generate:
    post:
      tags:
      - generate
      summary: Generate Audio
      description: "Generate completed speech audio from plain text.\n\nThe service may internally split long text into multiple\
        \ engine calls, but it\nMUST preserve the original text order and return one logically continuous audio\nresult. Internal\
        \ chunk boundaries are not part of the public API.\n\nGeneration settings are resolved in this order, from lowest\
        \ to highest precedence:\n\n1. Service defaults.\n2. The active profile, when `profile_id` is omitted and an active\
        \ profile exists.\n3. The explicitly selected `profile_id`, when present.\n4. The `persona`'s bound voice, when `persona`\
        \ is present (voice field only).\n5. Fields supplied directly in this request.\n\nRequest-level `engine_options` are\
        \ shallow-merged over profile-level\n`engine_options`; request keys win. Other request fields directly replace their\n\
        corresponding profile defaults.\n\nVoice and engine selection:\n\n* A request-level `voice_id` overrides the `persona`\
        \ voice; the persona voice\n  overrides the profile voice.\n* An unknown or disabled `persona` is rejected with `422\
        \ Unprocessable Entity`.\n* The resolved voice normally determines the engine.\n* `engine_id` is an optional advanced\
        \ override. The service MUST reject an\n  override that cannot use the resolved voice rather than silently substituting\n\
        \  another voice.\n* If no voice can be resolved from either the request or a profile, generation\n  fails with `409\
        \ Conflict`.\n\nOutput behavior:\n\n* `wav` returns a completed WAV container as `audio/wav`.\n* `pcm` returns headerless\
        \ signed 16-bit little-endian mono PCM as\n  `application/octet-stream`.\n* The actual output sample rate is always\
        \ returned in `X-Opal-Sample-Rate`.\n* When a `sample_rate` is explicitly requested, the service either returns audio\n\
        \  at that rate or rejects the request; it must not silently return another rate.\n* Plain text only is accepted.\
        \ SSML markup has no special meaning and is not a\n  supported input mode.\n"
      operationId: generate_audio_api_v1_generate_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          $ref: '#/components/responses/AudioResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/GenerationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdParameter'
    - $ref: '#/components/parameters/OpalTransactionIdParameter'
    - $ref: '#/components/parameters/OpalRequestIdParameter'
    - $ref: '#/components/parameters/OpalCausationIdParameter'
  /api/v1/generate/stream:
    post:
      tags:
      - generate
      summary: Stream Generated Audio
      description: "Generate speech synchronously while progressively streaming raw PCM bytes to the\ncaller.\n\nThis endpoint\
        \ always returns headerless signed 16-bit little-endian mono PCM.\nWAV is intentionally not supported for streaming\
        \ because the contract does not\nrequire buffering a complete container before response delivery.\n\nThe request follows\
        \ the same profile, voice, engine, speed, volume, sample-rate,\nand `engine_options` resolution rules as `/api/v1/generate`.\
        \ There is no\n`output_format` field because the streaming format is fixed to PCM.\n\nStreaming semantics:\n\n* HTTP\
        \ status and response headers are established before audio bytes are sent.\n* The actual sample rate is supplied by\
        \ `X-Opal-Sample-Rate` and remains constant\n  for the entire stream.\n* The channel count is always one and sample\
        \ format is always `s16le`.\n* The byte stream contains audio samples only—no WAV header, chunk markers,\n  events,\
        \ JSON envelopes, or internal text-chunk metadata.\n* Callers consume bytes until normal end-of-stream.\n* If generation\
        \ fails before streaming begins, the service returns a normal JSON\n  error response with an appropriate non-2xx status.\n\
        * If generation fails after a 200 response has begun, the service terminates the\n  stream. Clients MUST treat premature\
        \ termination as a failed generation; the\n  protocol does not inject an error object into the audio byte stream.\n\
        * Service-side text chunking MUST NOT reset sample format or sample rate between\n  internal chunks.\n"
      operationId: stream_audio_api_v1_generate_stream_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateStreamRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          $ref: '#/components/responses/PcmStreamResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/GenerationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdParameter'
    - $ref: '#/components/parameters/OpalTransactionIdParameter'
    - $ref: '#/components/parameters/OpalRequestIdParameter'
    - $ref: '#/components/parameters/OpalCausationIdParameter'
