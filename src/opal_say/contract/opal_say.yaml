openapi: 3.1.0
info:
  title: OPAL Say API
  version: 1.6.0
  description: "Implementation-neutral text-to-speech (TTS) service for the OPAL suite.\n\nOPAL Say provides a stable REST\
    \ contract over one or more host-installed TTS\nengine such as Piper or Kokoro. Clients interact with OPAL concepts—engine,\n\
    voice, profiles, generation settings, and audio output—without depending on a\nspecific engine's command line, model layout,\
    \ Python API, or native output format.\n\nDesign principles:\n\n* The OpenAPI contract is the public source of truth for\
    \ service behavior.\n* Engines are installed and discovered by the implementation; they are not created\n  or deleted\
    \ through this API.\n* Voice are registrations that point at voice/model resources already available\n  on the host. The\
    \ API never uploads or deletes model files.\n* A voice has a globally unique OPAL `voice_id` and normally determines which\n\
    \  engine is used.\n* Requests may optionally specify an `engine_id` override for testing or advanced\n  routing. The\
    \ selected engine must be compatible with the registered voice.\n* The portable controls are voice, speed, volume, output\
    \ format, and optionally\n  sample rate. Engine-specific features are carried in an opaque `engine_options`\n  object.\n\
    * Supported completed-audio formats are WAV and raw PCM.\n* Raw PCM is always signed 16-bit little-endian (`s16le`), mono.\
    \ Its sample rate\n  is returned in the `X-Opal-Sample-Rate` response header.\n* Streaming generation is synchronous from\
    \ the caller's perspective and returns a\n  progressive raw PCM byte stream. Streaming never returns a WAV container.\n\
    * Long input is internally chunked by the service. Internal chunk boundaries are\n  not visible in the generated audio\
    \ contract.\n* Audio playback, audio-device control, synthesis history, request logging,\n  performance history, and asynchronous\
    \ job management are intentionally outside\n  this API.\n* Configuration backup/import/export follows the same operational\
    \ model as the\n  sister OPAL Listen service.\n\n\nOPAL SUITE STANDARD v1.2 (normative)\nX-Opal-Session-Id is an optional\
    \ logical context identifier; it does not create a server-managed session or grant authorization. Entry-point services\
    \ generate one when absent where a workflow requires it, and propagate it unchanged. A preexisting service-local session\
    \ resource has a separate lifecycle. X-Opal-Transaction-Id is a single logical end-to-end operation and is not an atomic\
    \ distributed transaction. X-Opal-Request-Id identifies one inbound HTTP exchange and is regenerated for each downstream\
    \ HTTP hop (the incoming one can be used for diagnostics); X-Opal-Causation-Id names the immediate parent event/request,\
    \ where applicable. For inbound requests, if a transaction ID is absent the service assigns one; all response types (including\
    \ errors, streamed headers, and binary bodies) return session ID if known and transaction/request IDs. Never trust these\
    \ values for access control. Propagate them into derived ZeroMQ envelope metadata. All identifiers are opaque 1..128-character\
    \ printable ASCII tokens with no control/whitespace characters; client-supplied invalid values yield 422.\nStandard health\
    \ routes: /api/v1/health/, /api/v1/health/live, /api/v1/health/ready. Settings: GET and PATCH /api/v1/settings/ for the\
    \ whole map, plus GET, PUT and DELETE /api/v1/settings/{key} for individual keys retained for OPAL suite consistency;\
    \ PATCH is atomic. Mutable configuration uses strong ETags and mandatory If-Match with 428 missing, 412 stale. For bounded\
    \ configuration catalogs return full arrays (subject to explicit deployment caps); for growing histories use cursor pagination\
    \ with stable deterministic ordering, opaque next_cursor and has_more. Cursors are scoped to the exact filter set and\
    \ invalidate on mismatch (422); cursor values expire explicitly. Standard HTTP creation 201 Location, async admission\
    \ 202, empty deletion 204. Streaming keeps media-specific transports but exposes correlation headers, defined failure\
    \ behavior, and no unsupported replay guarantee. Configuration export/import/validation excludes secrets and history.\n"
tags:
- name: engine
  description: 'Discover and configure TTS engine installed by the service implementation.

    Engines are not created or deleted through this API.

    '
- name: voice
  description: 'Register and manage OPAL voice backed by engine-specific resources already

    present on the host. Voice operations never upload, modify, or delete model files.

    '
- name: profiles
  description: 'Manage reusable generation presets. Exactly one profile may be active at a time.

    The active profile supplies defaults when a generation request does not name a

    profile explicitly.

    '
- name: persona
  description: 'Manage named persona: identities that bind a registered voice so requests can

    select a consistent character with a single `persona` field. The schema is kept

    flat for Say v1; sister OPAL services may adopt the same persona identifiers for

    their own resources in future contract versions.

    '
- name: generate
  description: 'Generate completed or progressively streamed speech audio from plain text.

    SSML is not supported by version 1 of this contract.

    '
- name: settings
  description: Service-wide key/value settings.
- name: info
  description: Service identity, version and liveness probes.
- name: health
  description: Service readiness and health information. Playback devices are out of scope.
- name: backup
  description: Backup, restore, import, export, and validate OPAL Say configuration.
servers:
- url: http://127.0.0.1:8080
  description: Illustrative local endpoint; actual bind address and port are configurable.
paths:
  /api/v1/engine/:
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdParameter'
    - $ref: '#/components/parameters/OpalTransactionIdParameter'
    - $ref: '#/components/parameters/OpalRequestIdParameter'
    - $ref: '#/components/parameters/OpalCausationIdParameter'
    get:
      tags:
      - engines
      summary: List engines
      operationId: opal_engines_list
      description: Return all engines known to the service implementation. An engine can be known but unavailable. `enabled`
        is administrative configuration; `available` reports whether the implementation can currently use the engine. Returns
        the complete bounded catalog; pagination is not supported.
      responses:
        '200':
          description: Known engines.
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpalEngine'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/engine/{engine_id}:
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdParameter'
    - $ref: '#/components/parameters/OpalTransactionIdParameter'
    - $ref: '#/components/parameters/OpalRequestIdParameter'
    - $ref: '#/components/parameters/OpalCausationIdParameter'
    - $ref: '#/components/parameters/EngineId'
    get:
      tags:
      - engines
      summary: Get engine
      operationId: opal_engine_get
      description: Return one engine.
      responses:
        '200':
          description: Engine.
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpalEngine'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    patch:
      tags:
      - engines
      summary: Update engine
      operationId: opal_engine_patch
      description: Partially update engine configuration. Strong If-Match is mandatory.
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpalEnginePatch'
      responses:
        '200':
          description: Updated engine.
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpalEngine'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/v1/engine/{engine_id}/validate:
    parameters:
    - $ref: '#/components/parameters/EngineId'
    - $ref: '#/components/parameters/OpalSessionIdParameter'
    - $ref: '#/components/parameters/OpalTransactionIdParameter'
    - $ref: '#/components/parameters/OpalRequestIdParameter'
    - $ref: '#/components/parameters/OpalCausationIdParameter'
    post:
      tags:
      - engine
      summary: Validate Engine
      description: 'Validate that the engine is correctly configured and usable by the service.


        Validation should check the adapter/runtime and current engine configuration.

        A validation failure is normally returned as HTTP 200 with `valid: false` and

        diagnostic messages because the validation operation itself completed normally.

        '
      operationId: validate_engine_api_v1_engine__engine_id__validate_post
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Engine validation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpalValidationReport'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/voice/:
    get:
      tags:
      - voice
      summary: List Voice
      description: 'List registered OPAL voice. Registrations describe host-resident voice/model

        resources and their engine association; they do not contain the model data itself.


        Return the complete bounded configuration collection; pagination is not supported. An implementation may reject catalog
        sizes over an advertised deployment cap, rather than silently truncate.

        '
      operationId: list_voice_api_v1_voice__get
      parameters:
      - name: engine_id
        in: query
        required: false
        description: If supplied, return only voice registered to this engine.
        schema:
          type: string
          minLength: 1
      - name: enabled
        in: query
        required: false
        description: If supplied, filter by enabled state.
        schema:
          type: boolean
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Registered voice.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VoiceRead'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
            ETag:
              description: Strong revision of logical portable configuration
              schema:
                type: string
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    post:
      tags:
      - voice
      summary: Register Voice
      description: 'Register a host-resident voice/model resource with OPAL Say.


        `engine_voice_ref` is an opaque identifier interpreted only by the selected

        engine adapter. It may represent a model path, installed voice name, composite

        identifier, or another engine-defined reference. OPAL clients must not infer

        filesystem semantics from it.


        This endpoint does not upload, copy, download, or otherwise provision model

        files. Implementations SHOULD validate that the referenced resource can be

        resolved before accepting the registration.

        '
      operationId: create_voice_api_v1_voice__post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceCreate'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Voice registered successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceRead'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
            Location:
              description: Resource URL
              schema:
                type: string
        '404':
          description: The specified engine does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpalError'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '409':
          description: The requested `voice_id` is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpalError'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
      parameters:
      - $ref: '#/components/parameters/IfMatch'
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdParameter'
    - $ref: '#/components/parameters/OpalTransactionIdParameter'
    - $ref: '#/components/parameters/OpalRequestIdParameter'
    - $ref: '#/components/parameters/OpalCausationIdParameter'
  /api/v1/voice/{voice_id}:
    parameters:
    - $ref: '#/components/parameters/VoiceId'
    - $ref: '#/components/parameters/OpalSessionIdParameter'
    - $ref: '#/components/parameters/OpalTransactionIdParameter'
    - $ref: '#/components/parameters/OpalRequestIdParameter'
    - $ref: '#/components/parameters/OpalCausationIdParameter'
    get:
      tags:
      - voice
      summary: Get Voice
      description: Return one registered voice.
      operationId: get_voice_api_v1_voice__voice_id__get
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Voice details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceRead'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
            ETag:
              description: Strong revision of logical portable configuration
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    patch:
      tags:
      - voice
      summary: Update Voice
      description: 'Update a voice registration. The engine association and opaque

        `engine_voice_ref` may be changed, but the referenced host resource itself is

        never modified by this API.

        '
      operationId: update_voice_api_v1_voice__voice_id__patch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceUpdate'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Updated voice registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceRead'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The update would leave the voice in an incompatible or referenced state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpalError'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
      parameters:
      - $ref: '#/components/parameters/IfMatch'
    delete:
      tags:
      - voice
      summary: Unregister Voice
      description: 'Remove the OPAL voice registration only.


        The implementation MUST NOT delete the underlying model, voice files, engine

        resources, or other host assets. If a profile currently references this voice,

        the service SHOULD reject the operation with `409 Conflict` until the profile

        is changed or removed.

        '
      operationId: delete_voice_api_v1_voice__voice_id__delete
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '204':
          description: Voice registration removed. No response body is returned.
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The voice is still referenced by configuration such as a profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpalError'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
      parameters:
      - $ref: '#/components/parameters/IfMatch'
  /api/v1/voice/{voice_id}/validate:
    parameters:
    - $ref: '#/components/parameters/VoiceId'
    - $ref: '#/components/parameters/OpalSessionIdParameter'
    - $ref: '#/components/parameters/OpalTransactionIdParameter'
    - $ref: '#/components/parameters/OpalRequestIdParameter'
    - $ref: '#/components/parameters/OpalCausationIdParameter'
    post:
      tags:
      - voice
      summary: Validate Voice
      description: 'Ask the registered engine to validate that this voice registration can be

        resolved and is usable. Validation may include model metadata checks or a

        lightweight engine-specific load check but does not return generated speech.

        '
      operationId: validate_voice_api_v1_voice__voice_id__validate_post
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Voice validation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpalValidationReport'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/voice/{voice_id}/test:
    parameters:
    - $ref: '#/components/parameters/VoiceId'
    - $ref: '#/components/parameters/OpalSessionIdParameter'
    - $ref: '#/components/parameters/OpalTransactionIdParameter'
    - $ref: '#/components/parameters/OpalRequestIdParameter'
    - $ref: '#/components/parameters/OpalCausationIdParameter'
    post:
      tags:
      - voice
      summary: Test Voice
      description: 'Generate a short test utterance with this voice.


        The path selects the voice. Request fields can adjust the portable generation

        controls and engine-specific options. Unlike `/generate/stream`, this operation

        returns completed WAV or PCM audio.

        '
      operationId: test_voice_api_v1_voice__voice_id__test_post
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceTestRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          $ref: '#/components/responses/AudioResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/profiles/:
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdParameter'
    - $ref: '#/components/parameters/OpalTransactionIdParameter'
    - $ref: '#/components/parameters/OpalRequestIdParameter'
    - $ref: '#/components/parameters/OpalCausationIdParameter'
    get:
      tags:
      - profiles
      summary: List profiles
      operationId: opal_profiles_list
      description: Return the complete bounded profile collection; pagination is not supported. An implementation may reject
        catalog sizes over an advertised deployment cap rather than silently truncate.
      responses:
        '200':
          description: Configured profiles.
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpalProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    post:
      tags:
      - profiles
      summary: Create profile
      operationId: opal_profiles_create
      description: Create a reusable named profile. If `is_active` is true, the new profile becomes the only active profile.
        Strong If-Match on the current collection revision is mandatory.
      parameters:
