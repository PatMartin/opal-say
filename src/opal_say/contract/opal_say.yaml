x-opal-context-standard:
  version: '1.2'
  headers:
  - X-Opal-Session-Id
  - X-Opal-Transaction-Id
  - X-Opal-Request-Id
  - X-Opal-Causation-Id
  session_mode: context-only
  id_format: opaque-printable-ascii-1-to-128
  transaction_atomicity: false
  events:
    propagate:
    - session_id
    - transaction_id
    - request_id
    - causation_id
    zero_mq_frames: 2
    compatibility: metadata_schema_version versions the optional data.metadata block only; the two-frame wire envelope (topic
      + JSON with topic/data) is unchanged across versions. Consumers extract known correlation keys (session_id, transaction_id,
      request_id, causation_id) and MUST ignore unknown metadata fields; producers may emit any metadata_schema_version without
      breaking the wire contract.
    metadata_schema_version: '1.0'
  pagination:
    history: cursor
    configuration: none
    default_limit: 100
    max_limit: 500
  concurrency:
    settings_and_config_mutations: strong-etag-if-match-required
    missing_status: 428
    stale_status: 412
  streaming: Include HTTP context headers before bytes; after headers are sent, failures are represented by transport-specific
    terminal events or stream termination; no invented resumability.
security:
- BearerAuth: []
x-opal-authorization:
  version: '1.0'
  description: Suite REST authentication and authorization semantics. Loopback-only deployments may explicitly disable authentication;
    non-loopback deployments require authentication. Privileged configuration operations require authorization. 401 means
    missing or invalid authentication; 403 means authenticated but not permitted. Correlation IDs are never authorization
    credentials. Secret values must not appear in responses, exports, or error details.
  semantics:
    missing_or_invalid_credentials: '401'
    authenticated_but_not_permitted: '403'
    loopback: authentication may be explicitly disabled on loopback deployments
    non_loopback: authentication required
    privileged_operations: authorization required for configuration mutations
    credentials: correlation headers are transport context, never authorization credentials
    secrets: secret values must not appear in responses, exports, or error details
