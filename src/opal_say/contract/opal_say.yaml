components:
  securitySchemes:
    BearerAuth:
      $ref: '#/components/securitySchemes/BearerAuth'
  parameters:
    VoiceId:
      name: voice_id
      in: path
      required: true
      description: Globally unique OPAL voice identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      example: en-us-lessac-medium
    PersonaId:
      name: persona_id
      in: path
      required: true
      description: Globally unique OPAL persona identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      example: amy
    OpalSessionIdParameter:
      name: X-Opal-Session-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
      description: OPAL suite context propagation; opaque and not an authentication credential.
    OpalTransactionIdParameter:
      name: X-Opal-Transaction-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
      description: OPAL suite context propagation; opaque and not an authentication credential.
    OpalRequestIdParameter:
      name: X-Opal-Request-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
      description: OPAL suite context propagation; opaque and not an authentication credential.
    OpalCausationIdParameter:
      name: X-Opal-Causation-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
      description: OPAL suite context propagation; opaque and not an authentication credential.
    EngineId:
      name: engine_id
      in: path
      required: true
      description: Stable implementation-defined identifier of an installed TTS engine.
      schema:
        type: string
        minLength: 1
      example: piper
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Required current strong ETag of the complete logical configuration. Missing returns 428, stale returns
        412. One exact strong quoted tag required; weak tags, lists and * are rejected with 422.
      schema:
        type: string
        pattern: ^"[^"]+"$
    ProfileId:
      name: profile_id
      in: path
      required: true
      description: Numeric profile identifier.
      schema:
        type: integer
        minimum: 1
      example: 1
    SettingKey:
      name: key
      in: path
      required: true
      description: Setting key.
      schema:
        type: string
        minLength: 1
    BackupFilename:
      name: filename
      in: path
      required: true
      description: 'Filename/identifier of a backup managed by the service. It must not contain

        path separators or traversal components.

        '
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[^/\\]+$
      example: opal-say-2026-10-04T230000Z.tar.gz
  headers:
    AudioFormat:
      description: Logical output format returned in the response body.
      schema:
        $ref: '#/components/schemas/AudioFormat'
    SampleRate:
      description: Actual audio sample rate in Hz. Constant for the entire response body.
      schema:
        type: integer
        minimum: 8000
        maximum: 192000
      example: 22050
    Channels:
      description: Number of audio channels. OPAL Say v1 returns mono audio only.
      schema:
        type: integer
        enum:
        - 1
    SampleFormat:
      description: PCM sample representation. OPAL Say v1 standardizes on signed 16-bit little-endian.
      schema:
        type: string
        enum:
        - s16le
    ResolvedEngineId:
      description: Engine actually used for generation.
      schema:
        type: string
      example: piper
    ResolvedVoiceId:
      description: OPAL voice actually used for generation.
      schema:
        type: string
      example: en-us-lessac-medium
    ResolvedProfileId:
      description: Profile used to supply defaults, when a profile participated in resolution.
      schema:
        type: integer
        minimum: 1
      example: 1
    OpalSessionIdHeader:
      description: Effective OPAL session context for this response. Returned when a session identifier is known; conditionally
        present.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    OpalTransactionIdHeader:
      description: Logical transaction identifier for this exchange. Always returned; generated when the inbound request lacks
        one.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    OpalRequestIdHeader:
      description: Identifier of this inbound HTTP exchange. Always returned; regenerated for each downstream hop.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    OpalCausationIdHeader:
      description: Immediate parent event/request identifier for this response. Returned when applicable; conditionally present.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ETag:
      description: Strong revision of the portable logical configuration.
      schema:
        type: string
    Location:
      description: Canonical path of created resource.
      schema:
        type: string
  responses:
    AudioResponse:
      description: 'Completed generated audio. The media type corresponds to the resolved

        `output_format`. PCM bodies are headerless S16LE mono samples.

        '
      headers:
        X-Opal-Audio-Format:
          $ref: '#/components/headers/AudioFormat'
        X-Opal-Sample-Rate:
          $ref: '#/components/headers/SampleRate'
        X-Opal-Channels:
          $ref: '#/components/headers/Channels'
        X-Opal-Sample-Format:
          $ref: '#/components/headers/SampleFormat'
        X-Opal-Engine-Id:
          $ref: '#/components/headers/ResolvedEngineId'
        X-Opal-Voice-Id:
          $ref: '#/components/headers/ResolvedVoiceId'
        X-Opal-Profile-Id:
          $ref: '#/components/headers/ResolvedProfileId'
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
      content:
        audio/wav:
          schema:
            type: string
            format: binary
        application/octet-stream:
          schema:
            type: string
            format: binary
    PcmStreamResponse:
      description: 'Progressive raw PCM audio stream. Bytes are S16LE, mono, with no container,

        framing, JSON envelope, or chunk metadata. The response ends when generation

        completes. Transport-level chunk boundaries have no audio semantic meaning.

        '
      headers:
        X-Opal-Audio-Format:
          description: Always `pcm` for this endpoint.
          schema:
            type: string
            enum:
            - pcm
        X-Opal-Sample-Rate:
          $ref: '#/components/headers/SampleRate'
        X-Opal-Channels:
          $ref: '#/components/headers/Channels'
        X-Opal-Sample-Format:
          $ref: '#/components/headers/SampleFormat'
        X-Opal-Engine-Id:
          $ref: '#/components/headers/ResolvedEngineId'
        X-Opal-Voice-Id:
          $ref: '#/components/headers/ResolvedVoiceId'
        X-Opal-Profile-Id:
          $ref: '#/components/headers/ResolvedProfileId'
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    GenerationFailed:
      description: TTS generation failed after the request was accepted for processing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    Unauthorized:
      description: Missing or invalid authentication credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    Forbidden:
      description: Authenticated but not permitted for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    UnprocessableEntity:
      description: Request was well-formed but failed semantic validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    NotFound:
      description: The addressed resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    Conflict:
      description: The request conflicts with current resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    PreconditionFailed:
      description: 'If-Match precondition failed: the supplied ETag is stale.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    PreconditionRequired:
      description: If-Match precondition required but missing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    ServiceUnavailable:
      description: The service or a required dependency is currently unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    PayloadTooLarge:
      description: Request payload exceeds the advertised limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    OperationFailed:
      description: The operation was accepted but failed during execution.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
  schemas:
    AudioFormat:
      type: string
      enum:
      - wav
      - pcm
      description: '`wav` is a completed WAV container. `pcm` is headerless signed 16-bit

        little-endian mono PCM.

        '
      example: wav
    EngineOptions:
      type: object
      additionalProperties: true
      description: 'Opaque engine-specific options. The public contract deliberately does not define

        these keys or values. They are interpreted only by the resolved engine adapter.


        Portable behavior should use the standardized OPAL fields whenever possible.

        Implementations SHOULD reject unsupported or invalid engine options rather than

        silently ignoring them. Sensitive credentials or secrets SHOULD NOT be exposed

        through this object.

        '
      example:
        noise_scale: 0.667
    VoiceCreate:
      type: object
      additionalProperties: false
      required:
      - voice_id
      - name
      - engine_id
      - engine_voice_ref
      properties:
        voice_id:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          description: Globally unique OPAL identifier for this voice registration.
          example: en-us-lessac-medium
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Human-readable voice name.
          example: Lessac Medium
        description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          description: Optional human-readable description.
        engine_id:
          type: string
          minLength: 1
          description: Installed engine that owns/interprets `engine_voice_ref`.
          example: piper
        engine_voice_ref:
          type: string
          minLength: 1
          maxLength: 2048
          description: 'Opaque engine-specific reference to a voice/model resource already available

            on the host. Although an implementation may use a filesystem path here,

            clients must treat the value as an opaque string.

            '
          example: /opt/opal/voice/en_US-lessac-medium.onnx
        language:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          description: Optional BCP 47-style language tag or implementation-provided language label.
          example: en-US
        enabled:
          type: boolean
          default: true
          description: Whether this voice may be selected for generation.
        engine_options:
          $ref: '#/components/schemas/EngineOptions'
      example:
        voice_id: en-us-lessac-medium
        name: Lessac Medium
        engine_id: piper
        engine_voice_ref: /opt/opal/voice/en_US-lessac-medium.onnx
        language: en-US
        enabled: true
        engine_options: {}
    VoiceUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Partial update to a registered voice.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
        engine_id:
          type: string
          minLength: 1
          description: Reassign this registration to another installed engine.
        engine_voice_ref:
          type: string
          minLength: 1
          maxLength: 2048
          description: New opaque host-resource reference interpreted by the engine.
        language:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
        enabled:
          type: boolean
        engine_options:
          $ref: '#/components/schemas/EngineOptions'
    VoiceRead:
      type: object
      required:
      - voice_id
      - name
      - engine_id
      - engine_voice_ref
      - enabled
      - engine_options
      - metadata
      - created_at
      - updated_at
      properties:
        voice_id:
          type: string
          description: Globally unique OPAL voice identifier.
          example: en-us-lessac-medium
        name:
          type: string
          description: Human-readable voice name.
          example: Lessac Medium
        description:
          anyOf:
          - type: string
          - type: 'null'
        engine_id:
          type: string
          description: Engine associated with this registration.
          example: piper
        engine_voice_ref:
          type: string
          description: Opaque engine-specific reference to the host-resident voice/model resource.
          example: /opt/opal/voice/en_US-lessac-medium.onnx
        language:
          anyOf:
          - type: string
          - type: 'null'
          example: en-US
        enabled:
          type: boolean
        native_sample_rate:
          anyOf:
          - type: integer
            minimum: 8000
            maximum: 192000
          - type: 'null'
          readOnly: true
          description: Native voice/engine sample rate when known; not a guarantee about requested output rate.
          example: 22050
        engine_options:
          $ref: '#/components/schemas/EngineOptions'
        metadata:
          type: object
          additionalProperties: true
          readOnly: true
          description: Read-only engine-reported voice metadata. Keys are not standardized.
          example:
            quality: medium
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PersonaCreate:
      type: object
      additionalProperties: false
      required:
      - persona_id
      - name
      - voice_id
      properties:
        persona_id:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          description: Globally unique OPAL persona identifier.
          example: amy
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Human-readable persona name.
          example: Amy
        description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          description: Optional human-readable description or character notes.
        voice_id:
          type: string
          minLength: 1
          description: Registered voice this persona speaks with.
          example: en-gb-alan-low
        enabled:
          type: boolean
          default: true
          description: Whether this persona may be selected for generation.
      example:
        persona_id: amy
        name: Amy
        voice_id: en-gb-alan-low
        enabled: true
    PersonaUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Partial update to a persona.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
        voice_id:
          type: string
          minLength: 1
          description: Rebind the persona to a different registered voice.
        enabled:
          type: boolean
    PersonaRead:
      type: object
      required:
      - persona_id
      - name
      - voice_id
      - enabled
      - created_at
      - updated_at
      properties:
        persona_id:
          type: string
          example: amy
        name:
          type: string
          example: Amy
        description:
          anyOf:
          - type: string
          - type: 'null'
        voice_id:
          type: string
          description: Registered voice this persona speaks with.
          example: en-gb-alan-low
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GenerateRequest:
      type: object
      additionalProperties: false
      required:
      - text
      description: 'Request for completed speech audio. Any omitted generation setting is resolved

        from the selected/active profile and then service defaults.

        '
      properties:
        text:
          type: string
          minLength: 1
          description: 'Plain text to speak. Long text may be internally chunked. The maximum

            accepted request length is service-configurable and intentionally not fixed

            by the OpenAPI schema.

            '
          example: Hello from OPAL Say.
        profile_id:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: Explicit profile to use. If omitted/null, the active profile may supply defaults.
        voice_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          description: Request-level voice override. Takes precedence over the profile voice.
          example: en-us-lessac-medium
        persona:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 200
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          - type: 'null'
          description: 'Named persona supplying a default voice. An explicit `voice_id` in this

            request takes precedence over the persona voice; the persona voice takes

            precedence over profile-supplied voice. An unknown or disabled persona is

            rejected with `422 Unprocessable Entity`.

            '
          example: amy
        engine_id: null
        speed:
          anyOf:
          - type: number
            format: float
            minimum: 0.25
            maximum: 4.0
          - type: 'null'
          description: Request-level speech-rate override; `1.0` is normal speed.
        volume:
          anyOf:
          - type: number
            format: float
            minimum: 0.0
            maximum: 2.0
          - type: 'null'
          description: Request-level linear gain override; `1.0` is unchanged.
        output_format:
          anyOf:
          - $ref: '#/components/schemas/AudioFormat'
          - type: 'null'
          description: Request-level completed-audio format override.
        sample_rate:
          anyOf:
          - type: integer
            minimum: 8000
            maximum: 192000
          - type: 'null'
          description: Optional requested output sample rate in Hz.
        engine_options:
          $ref: '#/components/schemas/EngineOptions'
      example:
        text: The quick brown fox jumps over the lazy dog.
        voice_id: en-us-lessac-medium
        speed: 1.0
        volume: 1.0
        output_format: wav
        engine_options: {}
    GenerateStreamRequest:
      type: object
      additionalProperties: false
      required:
      - text
      description: 'Request for progressively streamed speech. The wire format is fixed to raw PCM,

        so there is intentionally no `output_format` property.

        '
      properties:
        text:
          type: string
          minLength: 1
          description: Plain text to speak. Long text may be internally chunked.
          example: This audio begins streaming as it is generated.
        profile_id:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: Explicit profile to use; otherwise the active profile may provide defaults.
        voice_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          description: Request-level voice override.
        persona:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 200
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          - type: 'null'
          description: Named persona supplying a default voice; `voice_id` takes precedence.
          example: amy
        engine_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          description: Optional advanced engine override; incompatible overrides are rejected.
        speed:
          anyOf:
          - type: number
            format: float
            minimum: 0.25
            maximum: 4.0
          - type: 'null'
        volume:
          anyOf:
          - type: number
            format: float
            minimum: 0.0
            maximum: 2.0
          - type: 'null'
        sample_rate:
          anyOf:
          - type: integer
            minimum: 8000
            maximum: 192000
          - type: 'null'
          description: Optional requested PCM stream sample rate in Hz.
        engine_options:
          $ref: '#/components/schemas/EngineOptions'
      example:
        text: Stream this sentence as raw PCM audio.
        profile_id: 1
        speed: 1.0
        volume: 1.0
        sample_rate: 22050
        engine_options: {}
    VoiceTestRequest:
      type: object
      additionalProperties: false
      description: 'Parameters for generating a short completed-audio voice test. If `text` is

        omitted, the implementation uses a short built-in neutral test phrase.

        '
      properties:
        text:
          type: string
          minLength: 1
          default: This is a test of the selected OPAL Say voice.
        speed:
          type: number
          format: float
          minimum: 0.25
          maximum: 4.0
          default: 1.0
        volume:
          type: number
          format: float
          minimum: 0.0
          maximum: 2.0
          default: 1.0
        output_format:
          allOf:
          - $ref: '#/components/schemas/AudioFormat'
          default: wav
        sample_rate:
          anyOf:
          - type: integer
            minimum: 8000
            maximum: 192000
          - type: 'null'
          default: null
        engine_options:
          $ref: '#/components/schemas/EngineOptions'
    ServiceInfo:
      type: object
      required:
      - name
      - version
      - api_version
      properties:
        name:
          type: string
          example: opal-say-svc
        version:
          type: string
          example: 1.0.0
        api_version:
          type: string
          example: v1
        description:
          type: string
          example: Implementation-neutral OPAL text-to-speech service
    LivenessRead:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
          example: ok
    OpalEngine:
      type: object
      properties:
        engine_id:
          type: string
          minLength: 1
          description: Stable engine identifier used by API requests and voice registrations.
          example: piper
        name:
          type: string
          minLength: 1
          description: Human-readable engine name.
          example: Piper
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional human-readable engine description.
          example: Local neural text-to-speech engine
        enabled:
          type: boolean
          description: Whether OPAL Say is administratively allowed to route generation to this engine.
          example: true
        available:
          type: boolean
          description: Whether the implementation can currently initialize and use the engine.
          example: true
        options:
          type: object
          additionalProperties: true
          description: Engine-specific option values.
        metadata:
          type: object
          additionalProperties: true
          readOnly: true
          description: 'Read-only implementation-reported engine metadata such as runtime version or

            adapter information. Clients must not require engine-specific metadata keys.

