[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opal-say"
version = "1.5.0"
description = "OPAL Say: implementation-neutral text-to-speech service (opal-say-svc), CLI and SPA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
piper = ["piper-tts>=1.3"]
kokoro = ["kokoro-onnx>=0.4"]
engines = ["piper-tts>=1.3", "kokoro-onnx>=0.4"]
dev = ["pytest>=8", "pytest-timeout>=2", "jsonschema>=4.21", "referencing>=0.30", "ruff>=0.4"]

[project.scripts]
opal = "opal_say.cli.main:app"
opal-say = "opal_say.cli.main:say_app"
opal-say-svc = "opal_say.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opal_say = ["contract/opal_say.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "piper: requires the Piper runtime and a Piper voice model on the host",
    "kokoro: requires the kokoro-onnx runtime and Kokoro model files on the host",
]
addopts = "-ra"
timeout = 30
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["opal_say", "conftest", "contract"]
